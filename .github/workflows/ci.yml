name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      # Two processes.  TensorFlow and SciPy's optimisers do not tear down
      # reliably in the same interpreter: every test passes and the process
      # then dumps core on exit, failing the job with nothing to point at.
      # conftest.py applies the `tensorflow` marker automatically.
      - name: Test (chemistry, no TensorFlow)
        run: pytest -m "not tensorflow" -W "ignore::UserWarning"
      # The ml extra is not installed here, so this collects nothing and exits
      # 5.  That is the expected outcome, not a failure; any other non-zero
      # status is.  `shell: bash` so the status check behaves the same on the
      # Windows runner as elsewhere.
      - name: Test (TensorFlow)
        shell: bash
        run: |
          pytest -m tensorflow -W "ignore::UserWarning" || status=$?
          if [ "${status:-0}" -eq 5 ]; then
            echo "TensorFlow not installed; TF tests not run."
          elif [ "${status:-0}" -ne 0 ]; then
            exit "$status"
          fi
      - name: Build
        run: |
          pip install build
          python -m build
